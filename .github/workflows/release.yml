name: release

# Push a tag like v0.3.0 to build, test and publish ciplink: wheels and an sdist to PyPI, the ciplink crate to
# crates.io, the C# binding to NuGet, and a GitHub release with the C header, prebuilt C libraries and the
# ciplink-server executables.
# See "Releasing" in CONTRIBUTING.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check the tag matches every package version
        shell: python
        run: |
          import os, re, tomllib
          tag = os.environ["GITHUB_REF_NAME"]
          versions = {
              "python/ciplink/_version.py": re.search(r'__version__ = "(.+)"', open("python/ciplink/_version.py").read())[1],
              "Cargo.toml": tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"],
              "Ciplink.csproj": re.search(r"<Version>(.+)</Version>", open("bindings/dotnet/Ciplink/Ciplink.csproj").read())[1],
              "crates/ciplink-server/Cargo.toml (ciplink)": tomllib.load(open("crates/ciplink-server/Cargo.toml", "rb"))["dependencies"]["ciplink"]["version"],
          }
          bad = {f: v for f, v in versions.items() if f"v{v}" != tag}
          if bad:
              raise SystemExit(f"tag {tag} does not match {bad}")

  # abi3 wheels (one per platform covers Python 3.9+), each tested on its own platform where the runner can run it
  wheels:
    needs: version
    name: wheel ${{ matrix.target }} ${{ matrix.manylinux }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto, test: true }
          - { os: ubuntu-latest, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-latest, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin, test: true }
          - { os: windows-latest, target: x64, test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Install the wheel and run the public-API tests
        if: matrix.test
        shell: bash
        run: |
          python -m pip install pytest
          python -m pip install ciplink --no-index --find-links dist --only-binary :all:
          python -m pytest tests/offline -q -p no:cacheprovider
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist/

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/

  pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing, no stored token
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  crates:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      contents: read
      id-token: write  # crates.io trusted publishing, no stored token
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: crates-auth
      # ciplink first: ciplink-server depends on it. A version already on crates.io is skipped (a re-run may follow a
      # success); the first version of each crate is published by hand, before its trusted publishing is set up.
      - name: cargo publish
        run: |
          for crate in ciplink ciplink-server; do
            version=$(cargo metadata --no-deps --format-version 1 | jq -r ".packages[] | select(.name == \"$crate\") | .version")
            status=$(curl -s -o /dev/null -w '%{http_code}' -A "ciplink-release (github.com/RowanRama/ciplink)" \
                     "https://crates.io/api/v1/crates/$crate/$version")
            if [ "$status" = 200 ]; then echo "$crate $version is already published"; else cargo publish -p "$crate"; fi
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}

  # crates/ciplink-ffi per platform: an archive for the GitHub release, and the shared library for the NuGet package;
  # and the ciplink-server executable, in an archive of its own
  ffi:
    needs: version
    name: ffi ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, rid: linux-x64, shared: libciplink.so, static: libciplink.a }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, rid: win-x64, shared: ciplink.dll, static: ciplink.lib, import: ciplink.dll.lib }
          - { os: macos-latest, target: aarch64-apple-darwin, rid: osx-arm64, shared: libciplink.dylib, static: libciplink.a }
          - { os: macos-latest, target: x86_64-apple-darwin, rid: osx-x64, shared: libciplink.dylib, static: libciplink.a }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: cargo build
        run: cargo build --release -p ciplink-ffi -p ciplink-server --target ${{ matrix.target }}
      - name: Package
        run: |
          built="target/${{ matrix.target }}/release"
          name="ciplink-ffi-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          mkdir -p "out/$name/include" "out/$name/lib" "out/runtimes/${{ matrix.rid }}/native"
          cp crates/ciplink-ffi/include/ciplink.h "out/$name/include/"
          cp LICENSE "out/$name/"
          echo "ciplink $GITHUB_REF_NAME C library. Documentation: https://rowanrama.github.io/ciplink/" > "out/$name/README.txt"
          for f in ${{ matrix.shared }} ${{ matrix.static }} ${{ matrix.import }}; do cp "$built/$f" "out/$name/lib/"; done
          cp "$built/${{ matrix.shared }}" "out/runtimes/${{ matrix.rid }}/native/"
          server="ciplink-server-${GITHUB_REF_NAME}-${{ matrix.rid }}"
          exe=""
          [ "$RUNNER_OS" = Windows ] && exe=.exe
          mkdir -p "out/$server"
          cp "$built/ciplink-server$exe" crates/ciplink-server/README.md LICENSE "out/$server/"
          cd out
          for archive in "$name" "$server"; do
            if [ "$RUNNER_OS" = Windows ]; then 7z a "$archive.zip" "$archive" >/dev/null; else tar -czf "$archive.tar.gz" "$archive"; fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ffi-${{ matrix.rid }}
          path: |
            out/*.zip
            out/*.tar.gz
            out/runtimes/
          if-no-files-found: error

  nuget:
    needs: [ffi, wheels, sdist]
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write  # NuGet trusted publishing, no stored API key
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          merge-multiple: true
          path: ffi/
      - name: dotnet pack
        run: dotnet pack bindings/dotnet/Ciplink -c Release -p:CiplinkRuntimesDir="$PWD/ffi/runtimes" -o nupkg
      - name: Check the package holds every runtime
        run: |
          unzip -l nupkg/*.nupkg | tee contents.txt
          for lib in win-x64/native/ciplink.dll linux-x64/native/libciplink.so osx-arm64/native/libciplink.dylib \
                     osx-x64/native/libciplink.dylib; do
            grep -q " runtimes/$lib$" contents.txt || { echo "missing runtimes/$lib"; exit 1; }
          done
      - uses: NuGet/login@v1
        id: nuget-login
        with:
          user: RowanRama
      - name: dotnet nuget push
        run: dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}

  github-release:
    needs: [ffi, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: ffi-*
          merge-multiple: true
          path: ffi/
      - name: Create the release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            crates/ciplink-ffi/include/ciplink.h ffi/*.zip ffi/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
