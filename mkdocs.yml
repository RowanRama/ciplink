site_name: ciplink
site_description: Read and write Allen-Bradley PLC tags over EtherNet/IP from Python, C, C++, C# and Rust.
site_url: https://rowanrama.github.io/ciplink/
repo_url: https://github.com/RowanRama/ciplink
repo_name: RowanRama/ciplink
edit_uri: edit/main/docs/
docs_dir: docs
exclude_docs: requirements.txt

theme:
  name: material
  features:
    - content.code.copy
    - content.tabs.link       # picking a language in one tab group picks it everywhere
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Reading and writing tags: reading-writing.md
      - Tag list and controller info: tag-list.md
      - Tag descriptions: descriptions.md
      - SLC 500 and MicroLogix: slc.md
      - Generic CIP messages: generic-messaging.md
      - Discovering and browsing devices: browsing.md
      - Trends: trends.md
      - Tag server: server.md
      - Adapter (I/O device): adapter.md
      - Testing with the simulator: simulator.md
      - Logging: logging.md
  - Reference:
      - Values and results: values.md
      - Errors: errors.md
      - Python API: api-python.md
      - Other languages: api.md
      - CIP reference: cip-reference.md
  - Releases: releases.md
  - Contributing: contributing.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            members_order: source
            filters: ["!^_"]
            heading_level: 3

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
