[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ciplink"
dynamic = ["version"]
description = "Ethernet/IP library for Allen-Bradley PLCs, a pycomm3 fork with instance-ID reads and tag-table change detection."
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rowan Ramamurthy", email = "rramamurthy@factoryautomation.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
]

[project.optional-dependencies]
tests = ["pytest"]

[project.urls]
Source = "https://github.com/RowanRama/ciplink"
Upstream = "https://github.com/ottowayi/pycomm3"
Documentation = "https://docs.pycomm3.dev"

[tool.setuptools.dynamic]
version = { attr = "ciplink._version.__version__" }

[tool.setuptools.packages.find]
include = ["ciplink*"]

[tool.setuptools.package-data]
ciplink = ["py.typed"]
