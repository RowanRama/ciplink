[package]
name = "ciplink"
description = "EtherNet/IP (CIP) driver for Allen-Bradley Logix, Micro800 and SLC/MicroLogix PLCs"
readme = "README.md"
keywords = ["plc", "ethernet-ip", "cip", "allen-bradley", "logix"]
categories = ["network-programming", "science"]
# the tests run from the repository: their fixtures are ~17 MB of JSON, above the crates.io size limit
exclude = ["tests/"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = "0.10"
getrandom = "0.3"
if-addrs = "0.15"
indexmap = "2"
log = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
sha1 = "0.10"
thiserror = "2"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[lints]
workspace = true
