# Regenerate with: cbindgen --config cbindgen.toml --crate ciplink-ffi --output include/ciplink.h
language = "C"
include_guard = "CIPLINK_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen from crates/ciplink-ffi/src/lib.rs. Do not edit. Documentation: https://rowanrama.github.io/ciplink/ */"
documentation_style = "c99"
style = "both"
usize_is_size_t = true

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[export]
include = ["CiplinkStatus", "CiplinkMessage"]
