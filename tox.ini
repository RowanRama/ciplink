# tox builds and installs the package (maturin, needs a Rust toolchain) in each environment
[tox]
envlist = py39, py310, py311, py312, py313

[testenv]
deps =
    pytest

commands =
    pytest tests/offline

setenv =
    PLCPATH=192.0.2.10

[testenv:online]
commands =
    pytest tests/online

[testenv:user]
commands =
    pytest --ignore tests/online/test_demo_plc.py tests
